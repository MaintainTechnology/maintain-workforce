<!doctype html>
<!--
  maintain-visual canvas skeleton.
  Copy into the work folder, restructure the layout freely per content —
  but the token values below are the brand and are not negotiable.
  Values mirror public/design-system/tokens.css (check it if you need more).
  Set canvas size inline:  <div class="canvas" style="--w:1080px; --h:1350px">
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>maintain-visual canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=block" rel="stylesheet">
<style>
  :root{
    /* Brand core — from public/design-system/tokens.css */
    --mw-ink-teal:#07272D; --mw-teal-deep:#051F24; --mw-teal-mist:#66A1AB;
    --mw-amber:#FFC400; --mw-amber-mid:#C79600; --mw-amber-deep:#8F6400;
    --mw-amber-tint-1:#FFF4CC; --mw-amber-tint-2:#FFE699;
    --mw-black:#101820; --mw-black-2:#0C1319; --mw-black-3:#1A2330;
    --mw-cloud:#F5F5F1; --mw-white:#FFFFFF;
    --on-dark:#FFFFFF; --on-dark-muted:rgba(255,255,255,.70); --on-dark-faint:rgba(255,255,255,.55);
    --hairline:rgba(255,255,255,.10);
    --font:'Manrope','Segoe UI',system-ui,sans-serif;
    --tracking-display:-0.02em; --tracking-caps:0.08em;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px;
    --grid-line:rgba(255,196,0,0.05); --grid-size:40px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--mw-ink-teal)}
  body{font-family:var(--font);color:var(--on-dark);-webkit-font-smoothing:antialiased}

  /* The canvas IS the viewport: screenshot with --viewport-size matching --w,--h */
  .canvas{width:var(--w);height:var(--h);background:var(--mw-ink-teal);
    overflow:hidden;position:relative;display:flex;flex-direction:column}

  /* Signature textures (use on the canvas or a section, not everywhere) */
  .grid-bg{background-image:
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:var(--grid-size) var(--grid-size)}
  .glow{background-image:radial-gradient(60% 60% at 70% 18%,rgba(255,196,0,.16),transparent 70%)}
  /* Combined rule: both classes set background-image, so composing them needs
     explicit layering (glow full-size on top, grid tiled beneath). */
  .grid-bg.glow{background-image:
    radial-gradient(60% 60% at 70% 18%,rgba(255,196,0,.16),transparent 70%),
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:100% 100%,var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size)}

  /* Type ramp — Manrope only; hierarchy by weight and size */
  .display{font-weight:800;line-height:1.02;letter-spacing:var(--tracking-display);text-wrap:balance}
  .stat{font-weight:800;line-height:.95;letter-spacing:var(--tracking-display);color:var(--mw-amber)}
  .body{font-weight:400;line-height:1.55;color:var(--on-dark-muted)}
  .label{font-weight:600;font-size:.6875em;letter-spacing:var(--tracking-caps);
    text-transform:uppercase;color:var(--on-dark-faint)}
  .em{color:var(--mw-amber)} /* amber emphasis — counts against the amber budget */

  /* Structure */
  .hairline-t{border-top:1px solid var(--hairline)}
  .hairline-b{border-bottom:1px solid var(--hairline)}
  .panel{background:var(--mw-black-2);border:1px solid var(--hairline);border-radius:var(--radius-lg)}
  .photo{object-fit:cover;width:100%;height:100%;display:block}
  .chip{display:inline-flex;align-items:center;gap:.5em;border:1px solid var(--hairline);
    border-radius:var(--radius-pill);padding:.45em 1em}
  .dot{width:8px;height:8px;border-radius:999px;display:inline-block}

  /* Footer band — amber ground, ink text (mirror of the site's primary button) */
  .band{background:var(--mw-amber);color:var(--mw-ink-teal);
    display:flex;align-items:center;justify-content:space-between}
  .band .label{color:var(--mw-ink-teal)}
</style>
</head>
<body>
<!-- Example skeleton: stat poster, portrait. Restructure per content. -->
<div class="canvas grid-bg glow" style="--w:1080px; --h:1350px">

  <header style="display:flex;align-items:center;padding:56px 72px 0">
    <img src="wordmark-on-dark.svg" alt="Maintain Workforce" style="height:44px">
  </header>

  <main style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 72px;gap:28px">
    <div class="label" style="font-size:15px;color:var(--mw-amber)">Kicker label</div>
    <h1 class="display" style="font-size:88px">Headline that carries the<br>whole message.</h1>
    <div class="stat" style="font-size:200px">92%</div>
    <div class="label" style="font-size:14px;max-width:52ch">Source · attribution line for the stat, verbatim from the content</div>
    <p class="body" style="font-size:26px;max-width:44ch">Supporting copy distilled from the pasted content. Two sentences at most.</p>
  </main>

  <!-- Photo panel: brand-graded imagery from generate-image.mjs -->
  <div style="height:340px" class="hairline-t">
    <img class="photo" src="panel-1.png" alt="">
  </div>

  <footer class="band" style="padding:28px 72px">
    <span class="label" style="font-size:14px">maintainworkforce.com.au</span>
    <span class="label" style="font-size:14px">Tagline or campaign line</span>
  </footer>

</div>
</body>
</html>
