<h2>Reset your password</h2>
<p>Review this request in Maintain Workforce, then explicitly confirm the one-time recovery link.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=%2Freset-password">Review password reset</a></p>
<p>If you did not request a password reset, you can ignore this email.</p>
